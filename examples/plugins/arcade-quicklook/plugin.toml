# Universal Quick Look integration (requires Arcade Quick Look).
[plugin]
id = "dev.arcade.quicklook"
name = "Universal Quick Look"
version = "1.0.0"
api_version = 1
description = "Preview files and links with Universal Quick Look."
executable = "integration.py"
args = ["arcade-quicklook", "open"]
permissions = ["read-text", "launch-apps"]

[[actions]]
id = "dev.arcade.quicklook.preview"
label = "Quick Look"
accepts = ["path", "url", "file"]
priority = 55
key = "y"
group = "inspect"
effects = ["launch-apps"]
