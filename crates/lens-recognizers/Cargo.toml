[package]
name = "lens-recognizers"
description = "Built-in Arcade Lens recognizers: OCR, structured text, colors, codes, windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lens-core.workspace = true
image.workspace = true
regex.workspace = true
chrono.workspace = true
rxing = "0.9"
ocrs = { version = "0.13", optional = true }
# Must match the rten version used by ocrs.
rten = { version = "0.26", optional = true }

[features]
# Portable local OCR engine. Models are loaded from files the app provides.
ocrs = ["dep:ocrs", "dep:rten"]

[dev-dependencies]
qrcode = { version = "0.14", default-features = false, features = ["image"] }
