# Builds every platform once from a release-candidate tag and publishes the files as a hidden prerelease on the test
# channel (Link's reusable publish: arcade-release.json with the Inno installer's switches, and an unsigned
# manifest.json). The installers are the ones CI builds and verifies on each OS (ci.yml is called here, and its
# release-manifest job checks the four asset kinds). "Tag a release" starts it; it can also be run by hand on an rc
# tag. Every exit gate runs against the published files; "Promote" then republishes the same bytes as stable with a
# signed manifest. Nothing here publishes stable (PLAN.md rule zero); nightlies come from nightly.yml.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag is this version's release candidate
        id: plan
        run: |
          version=$(python3 scripts/check-version.py)
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$GITHUB_REF" == refs/tags/* && "$tag" =~ ^v${version//./\\.}-rc\.[1-9][0-9]*$ ]] \
            || { echo "::error::run Release on a tag v$version-rc.N (got $GITHUB_REF)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      # Files are named with the plain version, so the promoted stable release carries the same names and bytes.
      label: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, ci]
    permissions:
      contents: write
    uses: qa-p1/Arcade-Link/.github/workflows/app-publish.yml@v1.1.0
    with:
      app: arcade.lens
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: test
      # linux-appimage, windows-installer (Inno and portable), macos-dmg, by name: "*-*" also matched desktop-lens
      # (Tier 1's logs), and its empty keyring.log failed rc.2's publish ("HTTP 400: Bad Content-Length").
      # release-manifest holds only the metadata Link's publish writes again.
      artifacts: "{linux-appimage,windows-installer,macos-dmg}"
      windows-installer: inno
      link-ref: v1.1.0
