# Arcade Wheel integration (requires Arcade Wheel).
[plugin]
id = "dev.arcade.wheel"
name = "Arcade Wheel"
version = "1.0.0"
api_version = 1
description = "Add what you selected (a link, a command, a snippet) as a Wheel action."
executable = "integration.py"
args = ["arcade-wheel", "add"]
permissions = ["read-text", "persists"]

[[actions]]
id = "dev.arcade.wheel.add"
label = "Add as Wheel Action"
accepts = ["url", "command", "text", "path"]
priority = 30
group = "save"
effects = ["persists"]
