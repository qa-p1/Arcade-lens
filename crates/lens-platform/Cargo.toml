[package]
name = "lens-platform"
description = "Arcade Lens platform adapters: capture, monitors, windows, shortcuts, IPC, autostart, tray, native OCR"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lens-core.workspace = true
lens-recognizers.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
global-hotkey = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }
tokio = { version = "1", features = ["rt", "time"] }
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = "0.9"
tray-icon = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Foundation", "Foundation_Collections", "Globalization", "Storage_Streams"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSDictionary", "NSError", "NSGeometry"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace", "CGEvent", "CGEventTypes", "CGDirectDisplay"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes"] }
