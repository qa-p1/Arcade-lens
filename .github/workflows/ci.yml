name: CI

# Every pull request and push to main is checked on Linux, Windows and macOS
# (scripts/check), then packaged on each OS and the installers verified. The
# installers, arcade-release.json and SHA256SUMS.txt are workflow artifacts.
# Nothing is published here: releases come from release.yml (which calls this
# workflow), started by hand as tag.yml describes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      label:
        description: Version part of the package file names (default the Cargo version)
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.label }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: scripts/check
        run: python3 scripts/check.py

  # The version (from Cargo.toml) and the label the packages are named with.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          LABEL: ${{ inputs.label }}
        run: |
          version=$(python3 scripts/check-version.py)
          # Builds from main and pull requests carry the Cargo version, as every fleet app's do; only the release
          # workflow passes a label (rc, nightly). A `-dev.<sha>` suffix made main builds prereleases, which the
          # stable channel never offers (docs/v1/DECISIONS.md D6).
          if [ -n "$LABEL" ]; then
            label=$LABEL
          else
            label=$version
          fi
          echo "version=$version label=$label"
          {
            echo "version=$version"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: [test, version]
    # The oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: python3 scripts/package.py --label "${{ needs.version.outputs.label }}"
      - name: Verify AppImage install, repair and uninstall in a temporary profile
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11
          dbus-run-session -- xvfb-run -a python3 scripts/verify-appimage.py dist/*.AppImage arcade.lens Arcade-Lens.AppImage arcade-lens
      - name: Tray icon registration (real StatusNotifierWatcher, isolated)
        run: |
          sudo apt-get install -y xdotool python3-dbus python3-gi libxkbcommon-x11-0
          link_tag=$(sed -n 's/^arcade-link = .*tag = "\([^"]*\)".*/\1/p' Cargo.toml)
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$link_tag" https://github.com/qa-p1/Arcade-Link "$RUNNER_TEMP/link"
          cargo build --release --manifest-path "$RUNNER_TEMP/link/Cargo.toml" -p arcade-link-cli
          /usr/bin/python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- /usr/bin/python3 tests/tray-registration.py target/release/arcade-lens "$RUNNER_TEMP/link/target/release/arcade-link" lens
      - name: The capture closes when another app takes focus (real binary, Xvfb)
        run: |
          sudo apt-get install -y x11-utils
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" python3 tests/overlay-focus.py target/release/arcade-lens
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - run: python3 scripts/package.py --label "${{ needs.version.outputs.label }}"
      - name: Verify silent install and uninstall on the ephemeral runner account
        shell: pwsh
        run: packaging\windows\verify.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    needs: [test, version]
    runs-on: macos-15
    env:
      # The oldest macOS the dmg supports (Info.plist LSMinimumSystemVersion).
      MACOSX_DEPLOYMENT_TARGET: "12.3"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: python3 scripts/package.py --label "${{ needs.version.outputs.label }}"
      - name: Minimum macOS of each slice
        run: |
          minos=$(otool -arch all -l target/universal/arcade-lens | awk '/LC_BUILD_VERSION/{f=1} f&&$1=="minos"{print $2; f=0}' | sort -u | tr '\n' ' ')
          echo "minimum macOS per slice: $minos"
          for v in $minos; do [ "$(printf '%s\n' "$v" 12.3 | sort -V | tail -1)" = 12.3 ] || { echo "a slice needs macOS $v"; exit 1; }; done
      - name: Verify DMG copy in a temporary home
        run: packaging/macos/verify-dmg-copy.sh "dist/ArcadeLens-${{ needs.version.outputs.label }}-macos-universal.dmg" "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.label }}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # The release metadata Tools reads, built from exactly these installers (the
  # portable exe is listed as portable, which Tools never installs).
  release-manifest:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: arcade-release.json and SHA256SUMS.txt
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          python3 scripts/arcade-release.py --id arcade.lens --version "$LABEL" --channel stable \
            --notes "https://github.com/qa-p1/Arcade-lens/blob/$GITHUB_SHA/CHANGELOG.md" --windows-installer inno dist
          python3 - dist/arcade-release.json <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          kinds = sorted((a['os'], a['kind']) for a in m['assets'])
          assert kinds == [('linux', 'appimage'), ('macos', 'dmg'), ('windows', 'inno'), ('windows', 'portable')], kinds
          assert next(a for a in m['assets'] if a['os'] == 'macos')['arch'] == 'universal'
          print(json.dumps(m, indent=2))
          PY
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: |
            dist/arcade-release.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
