[workspace]
resolver = "2"
members = ["crates/lens-core", "crates/lens-recognizers", "crates/lens-actions", "crates/lens-platform", "crates/lens-plugins", "crates/arcade-lens"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qa-p1/Arcade-lens"
rust-version = "1.95"

[workspace.dependencies]
lens-core = { path = "crates/lens-core" }
lens-recognizers = { path = "crates/lens-recognizers" }
lens-actions = { path = "crates/lens-actions" }
lens-platform = { path = "crates/lens-platform" }
lens-plugins = { path = "crates/lens-plugins" }
# Arcade Link (the shared protocol), pinned to a release tag. To build
# against a local checkout instead, add to .cargo/config.toml (not committed):
#   [patch."https://github.com/qa-p1/Arcade-Link"]
#   arcade-link = { path = "<path to>/Arcade-link/crates/arcade-link" }
arcade-link = { git = "https://github.com/qa-p1/Arcade-Link", tag = "v0.2.0", features = ["watch", "engines"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
bitflags = { version = "2", features = ["serde"] }
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# OCR inference and image codecs are unusably slow unoptimized; optimize
# dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2
