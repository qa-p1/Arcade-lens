[package]
name = "arcade-lens"
description = "Arcade Lens: select anything on screen and act on it"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "arcade-lens"
path = "src/main.rs"

[features]
default = ["ocrs"]
ocrs = ["lens-recognizers/ocrs"]

[dependencies]
lens-core.workspace = true
lens-recognizers.workspace = true
lens-actions.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
directories = "6"
lens-platform.workspace = true
lens-plugins.workspace = true
arboard = { version = "3", default-features = false, features = ["image-data"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
raw-window-handle = "0.6"
tiny-skia = "0.11"
ab_glyph = "0.2"
chrono.workspace = true

# rustls/ring on Linux; the OS TLS stack (and certificate store) elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = "3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false, features = ["image"] }
